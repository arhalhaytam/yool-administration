worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zones ─────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_login:10m rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=ws:10m       rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ── Structured JSON access log ──────────────────────────────────────────
    log_format json_log escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr"}';

    access_log /dev/stdout json_log;

    # ── Global security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "microphone=(self)"               always;
    # HSTS — tells browsers to always use HTTPS for 1 year (production only)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ── Upstream services ───────────────────────────────────────────────────
    upstream auth_svc     { server auth:8001;     keepalive 32; }
    upstream session_svc  { server session:8002;  keepalive 32; }
    upstream stt_svc      { server stt:8003;      keepalive 32; }
    upstream query_svc    { server query:8004;     keepalive 32; }
    # Next.js standalone server — no external port; reachable only via nginx
    upstream frontend_svc { server frontend:3000; keepalive 16; }

    client_max_body_size 1m;

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check available on HTTP (load balancer probes)
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # TLS certificates
        # For production: replace with Let's Encrypt or commercial certificate
        # For local dev: generated by scripts/generate_certs.sh
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern TLS configuration (Mozilla Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Health check (unauthenticated) ──────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend — auth & invite pages (explicit for clarity) ─────────────
        # These paths are named in invite/reset emails; keep them routed to the
        # frontend container even if a future nginx rewrite rule is added above.
        location ~ ^/(login|setup-account|accept-invite|reset-password|verify-email)(/.*)?$ {
            proxy_pass         http://frontend_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── Auth — login is extra rate-limited ──────────────────────────────
        location = /api/auth/login {
            # Nginx guards against raw HTTP flooding (20r/m).
            # Brute-force protection (5 FAILED attempts / 15 min) is handled
            # by the application-level Redis sliding window — it only counts
            # failures, which is the correct security-aware behaviour.
            limit_req zone=auth_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass         http://auth_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://auth_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── Session management ──────────────────────────────────────────────
        location /api/sessions/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://session_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location /api/courses/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://session_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location /api/hierarchy/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://session_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location /api/chapters/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://session_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── STT: HTTP health (app serves /health; public URL is /api/stt/health via gateway)
        location = /api/stt/health {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://stt_svc/health;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── STT WebSocket stream ────────────────────────────────────────────
        location /api/stt/ {
            limit_req  zone=ws      burst=5 nodelay;
            limit_conn ws_conn 5;

            proxy_pass         http://stt_svc;
            proxy_http_version 1.1;

            # WebSocket upgrade (works over both ws:// and wss://)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # ── Query / search ──────────────────────────────────────────────────
        location /api/query/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://query_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            # Semantic search calls OpenAI — allow up to 30 s before returning 504
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── Frontend static assets ──────────────────────────────────────────
        # No add_header here — adding any header in a location block would
        # suppress the security headers inherited from the http{} block.
        # Next.js standalone already sets Cache-Control: immutable on /_next/static/.
        location /_next/static/ {
            proxy_pass         http://frontend_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── Frontend catch-all — everything else goes to Next.js ────────────
        # Must be the last location block so all /api/* routes above take
        # precedence.  nginx uses longest-prefix matching for location blocks,
        # so "/" only wins when nothing more specific matched.
        location / {
            proxy_pass         http://frontend_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── 429 custom response ─────────────────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            return 429 '{"detail":"Too many requests. Please slow down."}';
            add_header Content-Type application/json;
        }
    }
}
