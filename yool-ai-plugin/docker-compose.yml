
services:

  # ── Data stores ──────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    ports:
    - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Migrations (run once then exit) ──────────────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ── Microservices ─────────────────────────────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Explicit so invite/reset emails never use a stale container default (https://localhost).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INVITE_BASE_URL: ${INVITE_BASE_URL:-http://localhost:3000}
    volumes:
      - ./secrets/jwt_private.pem:/app/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/app/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  session:
    build:
      context: .
      dockerfile: services/session/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets/jwt_public.pem:/app/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  stt:
    build:
      context: .
      dockerfile: services/stt/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets/jwt_public.pem:/app/secrets/jwt_public.pem:ro
      - model_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 5G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s  # Whisper medium ~1.5GB + pyannote ~200MB: allow 15 min on first run

  query:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets/jwt_public.pem:/app/secrets/jwt_public.pem:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────

  frontend:
    build:
      # The frontend lives in ../yool-frontend relative to this docker-compose file.
      # NEXT_PUBLIC_* vars are baked into the JS bundle at build time — they must
      # be provided as build args, not runtime environment variables.
      context: ../yool-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://localhost}
    restart: unless-stopped
    # No external ports — nginx is the only entry point.
    # The container is reachable inside the Docker network as "frontend:3000".
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',(r)=>{process.exit(r.statusCode>=400?1:0)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Reverse proxy ─────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP — health checks + redirect to HTTPS
      - "443:443"  # HTTPS — all traffic (API + frontend)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro  # TLS cert + key (run scripts/generate_certs.sh first)
    depends_on:
      frontend:
        condition: service_healthy
      auth:
        condition: service_healthy
      session:
        condition: service_healthy
      stt:
        condition: service_started   # STT may still be loading models — nginx returns 502 until ready
      query:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  model_cache:

networks:
  internal:
    driver: bridge
